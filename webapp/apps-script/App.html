<script>
(() => {
  'use strict';
  let publication = JSON.parse(document.getElementById('publication-data').textContent || '{}');
  const viewer = JSON.parse(document.getElementById('viewer-data').textContent || '{}');
  let staticViews = publication.static_views || {};
  let defaultView = staticViews.default || {score_channel:'Web',nps_group:'Detractores'};
  let dashboard = publication.screens?.dashboard || {};
  let comments = publication.screens?.comments || {};
  let linking = publication.screens?.linking || {};
  let datasets = publication.screens?.data || {};
  const $ = id => document.getElementById(id);
  const rows = value => Array.isArray(value) ? value : [];
  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const label = value => String(value ?? '').replace(/_/g, ' ').replace(/(^|\s)\p{L}/gu, char => char.toLocaleUpperCase());
  const format = value => typeof value === 'number' ? new Intl.NumberFormat('es-ES', {maximumFractionDigits: 1}).format(value) : String(value ?? '—');
  const summaryViews = [['period-aggregates','Agregados por periodo'],['daily','NPS clásico vs detractores'],['volume-mix','Cómo y cuándo lo dicen'],['cohorts','Comparativas cruzadas']];
  const npsViews = [['topics','Qué dicen los clientes'],['gaps','Brechas NPS']];
  const fallbackLinkingViews = [['situation','Situación del periodo'],['entity-summary','Resumen de evidencia'],['scenarios','Análisis de escenarios de evidencia']];
  const settingsViews = [['evolution','Evolución NPS'],['telemetry','Telemetría'],['adoption','Adopción'],['publication','Publicación']];
  let linkingViews = rows(linking.navigation).length ? rows(linking.navigation).map(item => [item.id, item.label]) : fallbackLinkingViews;
  const insightSections = [...(viewer.evolutionNpsVisible===false?[]:[['summary','Evolución NPS']]),['nps-analysis','Comentarios'],['linking','Causalidad']];
  const areas = [
    {id:'insights',label:'Insights',sections:insightSections},
    {id:'data',label:'Datos',sections:[['nps','NPS'],['helix','Helix']]}
  ];
  const state = {area:'insights',section:'summary',view:'period-aggregates',scenarioIndex:0,evidenceTopic:'',journeyTopic:'',scenarioDetail:'helix',evidenceView:'table',adminRoute:'',settingsView:'evolution',scoreChannel:'Web',npsGroup:'Detractores',gapDimension:'Palanca',started:performance.now()};
  const scopeCatalog = rows(viewer.publicationCatalog);
  const sessionId = (window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`).slice(0,80);
  const activityQueue = [];
  const datasetCache = {};
  let activityTimer = 0;
  let activityCache = {key:'',report:null};
  let telemetryReady = !viewer.shellDeferred;

  function purgeCharts() {
    if (!window.Plotly) return;
    document.querySelectorAll('.chart').forEach(node => window.Plotly.purge(node));
  }

  const PUBLIC_VIEW_REGISTRY = {
    summary: summaryViews,
    'nps-analysis': npsViews,
    linking: linkingViews
  };

  function applyPublication(payload) {
    publication=payload||{};
    state.evidenceTopic='';
    state.journeyTopic='';
    staticViews=publication.static_views||{};
    defaultView=staticViews.default||defaultView;
    dashboard=publication.screens?.dashboard||{};
    comments=publication.screens?.comments||{};
    linking=publication.screens?.linking||{};
    datasets=publication.screens?.data||{};
    linkingViews=rows(linking.navigation).length?rows(linking.navigation).map(item=>[item.id,item.label]):fallbackLinkingViews;
    PUBLIC_VIEW_REGISTRY.linking=linkingViews;
    Object.entries(publication.brand?.design_tokens||{}).forEach(([key,value])=>{
      if(/^color\.[a-z0-9.-]+$/i.test(key)&&/^#[0-9a-f]{6}$/i.test(String(value)))document.documentElement.style.setProperty(`--bbva-${key.replaceAll('.','-')}`,value);
    });
  }

  async function decodePublication(encoded) {
    const normalized=String(encoded||'').replace(/-/g,'+').replace(/_/g,'/');
    const padded=normalized+'='.repeat((4-normalized.length%4)%4);
    const binary=atob(padded), bytes=Uint8Array.from(binary,char=>char.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(stream).text());
  }

  function detailViews(section) {
    return PUBLIC_VIEW_REGISTRY[section] || [];
  }
  function richText(value) {
    return esc(value).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
  }
  function table(items, limit = 250, preferredColumns = []) {
    const data = rows(items).slice(0, limit);
    if (!data.length) return '<div class="empty">No hay información suficiente en esta edición.</div>';
    const available = [...new Set(data.flatMap(row => Object.keys(row || {})))];
    const columns = [...preferredColumns.filter(key => available.includes(key)), ...available.filter(key => !preferredColumns.includes(key))].filter(key => !/__(href|hyperlink|segments)$/.test(key)).slice(0, 14);
    return `<div class="table-wrap"><table><thead><tr>${columns.map(key => `<th>${esc(label(key))}</th>`).join('')}</tr></thead><tbody>${data.map(row => `<tr>${columns.map(key => {
      const raw = row?.[key];
      const text = Array.isArray(raw) ? raw.join(' · ') : typeof raw === 'object' && raw !== null ? JSON.stringify(raw) : format(raw);
      const href = String(row?.[`${key}__href`] || '');
      return `<td>${href ? `<a href="${esc(href)}" target="_blank" rel="noreferrer">${esc(text)}</a>` : evidenceText(text,row?.[`${key}__segments`])}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  function metric(name, value, delta) {
    const deltaClass=delta?.favorable===true?'positive':delta?.favorable===false?'negative':'';
    return `<article class="metric-card"><span>${esc(name)}</span><strong>${esc(format(value))}</strong>${delta?`<small class="metric-delta ${deltaClass}">${esc(delta.display||format(delta.value))}</small>`:''}</article>`;
  }
  function metrics(items, className='') { return `<div class="metric-grid ${className}">${rows(items).map(item=>metric(item.label,item.value,item.delta)).join('')}</div>`; }
  function figure(spec, id) {
    if (!spec?.data?.length) return '<div class="empty">No hay señal suficiente para construir esta visualización.</div>';
    setTimeout(() => { const target = $(id); if (target && window.Plotly) Plotly.newPlot(target, spec.data, spec.layout || {}, {displayModeBar:false,responsive:true}); }, 0);
    return `<div id="${id}" class="chart"></div>`;
  }
  function snapshotFilters() {
    const method=publication.scope?.causal_method_label||publication.filters?.touchpoint_source||'—';
    if(!viewer.isAdmin||scopeCatalog.length<2)return '';
    return `<div class="toolbar snapshot-filters"><label class="field">Edición publicada<select id="static-scope">${scopeCatalog.map(item=>`<option value="${esc(item.scopeKey)}" ${item.scopeKey===publication.scope?.key?'selected':''}>${esc(item.label||method)}</option>`).join('')}</select></label></div>`;
  }
  function causalMethodFilter(){
    const scope=publication.scope||{};
    const options=scopeCatalog.filter(item=>['buug','n1','n2','year','month'].every(key=>String(item[key]||'')===String(scope[key]||'')));
    if(!options.length)return readonlyField('Canal','Web')+readonlyField('Método de agrupación',scope.causal_method_label||'—');
    return `${readonlyField('Canal','Web')}<label class="field">Método de agrupación<select id="causal-method" ${viewer.causalMethodLocked?'disabled':''}>${options.map(item=>`<option value="${esc(item.scopeKey)}" ${item.scopeKey===scope.key?'selected':''}>${esc(item.causalMethodLabel)}</option>`).join('')}</select></label>`;
  }
  function hero(title, copy, options={}) {
    const pills=options.pills===false?[]:rows(options.pills||dashboard.context_pills);
    return `<section class="surface-card context-card"><div class="section-heading"><div>${options.eyebrow?`<p class="eyebrow">${esc(options.eyebrow)}</p>`:''}<h2>${esc(title)}</h2><p class="secondary-copy">${esc(copy || 'Información consolidada con las mismas reglas de negocio de NPS Lens local.')}</p></div></div>${pills.length?`<div class="pills">${pills.map(value=>`<span class="pill">${esc(value)}</span>`).join('')}</div>`:''}${options.filters?snapshotFilters():''}${options.body||''}</section>`;
  }
  function contentTabs(items, active=state.view, dataAttribute='detail', ariaLabel='Detalle de pantalla') {
    return items.length ? `<nav class="content-tabs" aria-label="${esc(ariaLabel)}">${items.map(([id,name]) => `<button class="tab ${id === active ? 'active' : ''}" data-${dataAttribute}="${esc(id)}">${esc(name)}</button>`).join('')}</nav>` : '';
  }
  function kpiCards(block, fallback, withDeltas) {
    const kpis = block?.kpis || fallback || {};
    const display = block?.display || {};
    const deltas=(withDeltas??block?.show_deltas)?block?.deltas||{}:{};
    return `<div class="metric-grid metric-grid-5">${[['Comentarios','comments'],['Score medio','nps_average'],['NPS clásico','classic_nps'],['Detractores','detractor_rate'],['Promotores','promoter_rate']].map(([name,key]) => metric(name,display[key] ?? kpis[key],deltas[key])).join('')}</div>`;
  }
  function noteList(items, empty='') { const values=rows(items); return values.length?`<article class="note-card"><ul class="plain-list">${values.map(item=>`<li>${richText(item)}</li>`).join('')}</ul></article>`:(empty?`<article class="note-card"><p class="secondary-copy">${esc(empty)}</p></article>`:''); }
  function heading(eyebrow,title,copy,controls='') { return `<div class="section-heading section-heading-inline"><div>${eyebrow?`<p class="eyebrow">${esc(eyebrow)}</p>`:''}<h3>${esc(title)}</h3>${copy?`<p class="secondary-copy">${esc(copy)}</p>`:''}</div>${controls}</div>`; }
  function compactPeriodLabel(label) { return String(label||'Periodo').replace(/\b\d{2}(\d{2})\b/g,'$1'); }
  function readonlyField(name,value){return `<div class="readonly-field"><span>${esc(name)}</span><strong>${esc(value||'—')}</strong></div>`;}
  function summary(view) {
    const overview = dashboard.overview || {};
    const cumulative=dashboard.scope?.cumulative;
    const overviewHeader=hero(cumulative?.label||'Datos acumulados',cumulative?.note,{eyebrow:'Ámbito de análisis',filters:true,body:kpiCards(cumulative,dashboard.kpis,false)});
    const tabs = overviewHeader+contentTabs(summaryViews);
    if (view === 'period-aggregates') {
      const historical=dashboard.scope?.historical;
      const period = dashboard.scope?.period;
      return tabs+`<section class="surface-card stack-panel">${historical?heading('',historical.label,historical.note)+kpiCards(historical,dashboard.kpis,false):''}${heading('',period?.label||dashboard.context_label||'Periodo seleccionado',period?.note||'')}${kpiCards(period,dashboard.kpis)}${figure(overview.period_aggregates_figure,'period-chart')}</section>`;
    }
    if (view === 'daily') return tabs+`<section class="surface-card stack-panel">${figure(overview.daily_kpis_figure,'daily-kpis')}${figure(overview.daily_mix_figure,'daily-mix')}${noteList(overview.daily_explanation_bullets)}</section>`;
    if (view === 'volume-mix') return tabs+`<section class="surface-card">${figure(overview.daily_volume_mix_figure,'volume-chart')}</section>`;
    const cohorts=dashboard.cohorts||{}; return tabs+`<section class="surface-card stack-panel">${heading('Cohortes','Bolsas de fricción','',`<div class="inline-actions">${readonlyField('Canal','Web')}${readonlyField('Filas',cohorts.row_dimension)}${readonlyField('Columnas',cohorts.column_dimension)}</div>`)}${figure(cohorts.figure,'cohort-chart')}</section>`;
  }
  function npsAnalysis(view) {
    const controls=comments.controls||{}, channels=rows(controls.channels), groups=rows(controls.groups), dimensions=rows(controls.dimensions);
    const selectors=`<div class="toolbar snapshot-filters"><label class="field">Canal<select id="comments-channel">${channels.map(value=>`<option ${value===state.scoreChannel?'selected':''}>${esc(value)}</option>`).join('')}</select></label>${view==='gaps'?'':`<label class="field">Grupo score<select id="comments-group">${groups.map(value=>`<option ${value===state.npsGroup?'selected':''}>${esc(value)}</option>`).join('')}</select></label>`}${view==='topics'?'':`<label class="field">Dimensión<select id="comments-dimension">${dimensions.map(value=>`<option ${value===state.gapDimension?'selected':''}>${esc(value)}</option>`).join('')}</select></label>`}</div>`;
    const tabs=contentTabs(npsViews)+selectors;
    const topic=comments.topics?.[state.scoreChannel]?.[state.npsGroup]||{};
    if (view === 'topics') { const topicRows=rows(topic.rows).map(row=>({Cluster:row.cluster_id,n:row.n,Términos:rows(row.top_terms).join(', '),Ejemplos:rows(row.examples).join(' · ')})); return tabs+`<section class="surface-card stack-panel">${figure(topic.figure,'topics-chart')}${table(topicRows,250,['Cluster','n','Términos','Ejemplos'])}${noteList(topic.insights)}</section>`; }
    const gaps=comments.gaps?.[state.scoreChannel]?.[state.gapDimension]||{}, gapLabel=gaps.gap_column_label||'Brecha vs Base', periodLabel=compactPeriodLabel(dashboard.context_label);
    const gapRows=rows(gaps.table).map(row=>({Valor:row.value,'Peso en la muestra':row.sample_share==null?'—':format(row.sample_share*100)+'%',[`Total opiniones [${periodLabel}]`]:row.n,[`Opiniones detractoras [${periodLabel}]`]:row.detractors,[`% promotor [${periodLabel}]`]:row.promoter_rate==null?'—':format(row.promoter_rate*100)+'%',[`% detractor [${periodLabel}]`]:row.detractor_rate==null?'—':format(row.detractor_rate*100)+'%',[`NPS Clásico [${periodLabel}]`]:row.nps,[gapLabel]:row.gap_vs_base}));
    const range=gaps.base_range?.start&&gaps.base_range?.end?` (${esc(format(gaps.base_range.start))} - ${esc(format(gaps.base_range.end))})`:'';
    return tabs+`<section class="surface-card stack-panel">${heading('Brechas',gaps.title||'Brechas NPS',gaps.subtitle)}<p class="metric-note">NPS clásico base: <strong>${esc(format(gaps.base_nps))}</strong>${range}</p>${figure(gaps.figure,'gaps-chart')}${table(gapRows,250,['Valor','Peso en la muestra',`Total opiniones [${periodLabel}]`,`Opiniones detractoras [${periodLabel}]`,`% promotor [${periodLabel}]`,`% detractor [${periodLabel}]`,`NPS Clásico [${periodLabel}]`,gapLabel])}</section>`;
  }
  function evidenceText(text, segments) {
    return Array.isArray(segments) && segments.length ? segments.map(segment => segment.bold ? `<strong>${esc(segment.text)}</strong>` : esc(segment.text)).join('') : esc(text);
  }
  function topicFilter(id, topics, value) {
    return `<label class="field">NPS topic<select id="${id}"><option value="">Todos</option>${topics.map(topic=>`<option value="${esc(topic)}" ${topic===value?'selected':''}>${esc(topic)}</option>`).join('')}</select></label>`;
  }
  function scenarioEvidence(records,kind){if(state.evidenceView==='table'){if(kind==='helix')return table(rows(records).map(row=>({ID:row.incident_id,ID__href:row.url||row.incident_id__href,'Evidencia Helix':row.summary,'Evidencia Helix__segments':row.summary_segments})),50,['ID','Evidencia Helix']);return table(rows(records).map(row=>({ID:row.comment_id,Fecha:row.date,Score:row.nps,Grupo:row.group,Palanca:row.palanca,Subpalanca:row.subpalanca,Comentario:row.comment,Comentario__segments:row.comment_segments})),50,['ID','Fecha','Score','Grupo','Palanca','Subpalanca','Comentario']);}return `<div class="evidence-card-grid">${rows(records).map(row=>`<article class="evidence-card"><div class="evidence-pill-row"><span class="evidence-pill">${esc(kind==='helix'?(row.incident_id||'INC'):`ID: ${row.comment_id||'-'}`)}</span>${kind==='voc'?`<span class="evidence-pill">Fecha: ${esc(format(row.date))}</span><span class="evidence-pill">Score: ${esc(format(row.nps))}</span>`:''}</div><p>${evidenceText(row.summary||row.comment||'',kind==='helix'?row.summary_segments:row.comment_segments)}</p></article>`).join('')||'<div class="empty">Sin evidencia visible.</div>'}</div>`;}
  function scenarioCard(card,index,total) {
    if (!card) return '<div class="empty">No hay evidencia vinculada en esta edición.</div>';
    const title=card.title||card.anchor_topic||`Escenario ${index+1}`;
    const story=card.statement||card.chain_story||card.rationale||card.summary||'';
    const helix=rows(card.incident_records), voc=rows(card.comment_records);
    const details=[['helix',`Evidencia Helix (${helix.length})`],['voc',`Comentarios (${voc.length})`]];
    const detail=state.scenarioDetail==='voc'?scenarioEvidence(voc,'voc'):scenarioEvidence(helix,'helix');
    return `<article class="surface-card scenario" id="active-scenario" tabindex="-1" aria-label="Escenario de evidencia ${index+1} de ${total}"><header class="scenario-head"><div><p class="eyebrow">Evidencia observada</p><h3>${esc(title)}</h3><p class="scenario-story">${esc(story)}</p></div><span class="scenario-rank" aria-label="Posición ${esc(card.rank||index+1)}">#${esc(card.rank||index+1)}</span></header><div class="scenario-flow">${rows(card.flow_steps).map(step=>`<span>${esc(step)}</span>`).join('')}</div><div class="scenario-overview-grid"><article class="scenario-fact-sheet"><h4>Ficha descriptiva</h4><dl>${rows(card.identity_rows).map(item=>`<div><dt>${esc(item.label)}</dt><dd>${esc(item.value)}</dd></div>`).join('')}</dl></article><div class="scenario-evidence-stack"><article class="scenario-fact-sheet"><h4>${helix.length} incidencias enlazadas</h4><div class="evidence-pill-row">${helix.slice(0,6).map(row=>{const href=row.url||row.incident_id__href;return href?`<a class="evidence-pill" href="${esc(href)}" target="_blank" rel="noreferrer">${esc(row.incident_id||'INC')}</a>`:`<span class="evidence-pill">${esc(row.incident_id||'INC')}</span>`;}).join('')}</div></article><article class="scenario-fact-sheet"><h4>${voc.length} comentarios enlazados</h4><div class="evidence-pill-row">${voc.slice(0,6).map(row=>`<span class="evidence-pill">${esc(row.comment_id||'VOC')}</span>`).join('')}</div></article></div></div><div class="scenario-grid">${rows(card.spotlight_metrics).map(item=>`<div class="fact"><span>${esc(item.label||'Indicador')}</span><strong>${esc(format(item.value))}</strong></div>`).join('')}</div><div class="evidence-toolbar"><div class="segmented"><button data-evidence-view="table" class="${state.evidenceView==='table'?'active':''}">Tabla</button><button data-evidence-view="cards" class="${state.evidenceView==='cards'?'active':''}">Cards</button></div><span><strong>${helix.length}</strong> evidencias Helix visibles · <strong>${voc.length}</strong> comentarios VoC visibles</span></div>${contentTabs(details,state.scenarioDetail,'scenario-detail')}${detail}</article>`;
  }
  function scenarioWorkspace(cards) {
    const items=rows(cards), total=items.length;
    if(!total)return scenarioCard(null,0,0);
    state.scenarioIndex=((state.scenarioIndex%total)+total)%total;
    const card=items[state.scenarioIndex], disabled=total<=1?'disabled':'';
    return `<nav class="scenario-nav" aria-label="Navegación entre escenarios de evidencia"><button class="button ghost" data-scenario-step="-1" ${disabled}>Anterior</button><div class="scenario-nav-meta" aria-live="polite"><strong>Escenario ${state.scenarioIndex+1} de ${total}</strong><span>${esc(card.selection_label||card.title||'Escenario de evidencia')}</span></div><button class="button ghost" data-scenario-step="1" ${disabled}>Ver siguiente</button></nav>${scenarioCard(card,state.scenarioIndex,total)}`;
  }
  function linkingView(view) {
    const tabs = contentTabs(linkingViews);
    if (!linking.available) return tabs + hero('Cruce todavía no disponible',linking.empty_state || 'Se necesita una base Helix y NPS suficiente.');
    const method=linking.causal_method||{}; const context=hero('Ámbito del análisis NPS ↔ Helix',method.summary,{pills:linking.context_pills,filters:false,body:`<div class="inline-actions">${causalMethodFilter()}</div>`})+tabs;
    if (view === 'situation') {const situation=linking.situation||{}, narrative=situation.narrative||{}, evidence=situation.evidence||{};const topics=[...new Set(rows(evidence.rows).map(row=>row['NPS Topic']).filter(Boolean))].sort();return context+`<section class="surface-card stack-panel">${heading(narrative.kicker||'Evidencia observada',narrative.title||'Sin vínculos semánticos en esta ventana',narrative.summary)}${metrics(narrative.metrics,'metric-grid-3')}${rows(situation.metadata).length?`<div class="pills">${rows(situation.metadata).map(item=>`<span class="pill"><strong>${esc(item.label)}:</strong> ${esc(item.value)}</span>`).join('')}</div>`:''}${situation.note?`<article class="note-card"><p>${esc(situation.note)}</p></article>`:''}${heading('',evidence.title||'Evidencias',evidence.subtitle||'')}${topicFilter("evidence-topic",topics,state.evidenceTopic)}${table(rows(evidence.rows).filter(row=>!state.evidenceTopic||row['NPS Topic']===state.evidenceTopic),100)}</section>`;}
    if (view === 'entity-summary') {const entity=linking.entity_summary||{}, selected=entity.topic_figures?.[state.journeyTopic], chart=selected?{...selected,layout:{...entity.figure?.layout,...selected.layout}}:entity.figure;return context+`<section class="surface-card stack-panel">${heading('',entity.title||'Resumen de evidencia',entity.subtitle)}${metrics(entity.kpis,'metric-grid-3')}${method.value==='broken_journeys'?topicFilter('journey-topic',Object.keys(entity.topic_figures||{}),state.journeyTopic):''}${heading('',entity.figure_title||'Lectura visual','')}${figure(chart,'entity-chart')}${heading('',entity.table_title||'Detalle de evidencia','')}${table(rows(entity.table).filter(row=>!state.journeyTopic||row['Tópico NPS ancla']===state.journeyTopic))}</section>`;}
    if (view === 'scenarios') return context+`<section class="linking-stack">${heading('',linking.scenarios?.title||'Escenarios de evidencia',linking.scenarios?.subtitle)}<div class="scenario-workspace">${scenarioWorkspace(linking.scenarios?.cards)}</div></section>`;
    return context;
  }
  function data(view) {
    const source = datasets[view] || {};
    const cacheKey=view;
    if(source.deferred&&!datasetCache[cacheKey])setTimeout(()=>loadStaticDataset(view,cacheKey),0);
    const visible=datasetCache[cacheKey]||source;
    const title=view==='nps'?'Base NPS':'Base Helix';
    return hero(title,'Vista tabular del mismo dataset persistido que soporta el análisis local.',{eyebrow:'Datos',filters:view==='nps'})+`<section class="surface-card stack-panel"><div class="table-meta"><span>Filas: <strong>${esc(format(visible.total_rows??rows(visible.rows).length))}</strong></span><span>Columnas: <strong>${esc(rows(visible.columns).length)}</strong></span></div>${visible.error?`<p class="error">${esc(visible.error)}</p>`:source.deferred&&!datasetCache[cacheKey]?'<div class="status">Cargando datos del ámbito…</div>':table(visible.rows,500)}</section>`;
  }
  async function loadStaticDataset(view,cacheKey){try{datasetCache[cacheKey]=await rpc('getPublishedDataset',[view,publication.scope?.key||viewer.scopeKey]);if(state.area==='data'&&state.section===view)render();}catch(error){datasetCache[cacheKey]={rows:[],columns:[],total_rows:0,error:error.message};if(state.area==='data'&&state.section===view)render();}}
  function localPublishedDataset(kind){
    const source=publication.snapshots?.data?.datasets?.[kind];
    if(!source)return {dataset_kind:kind,total_rows:0,columns:[],rows:[]};
    const page=source.page;
    return {dataset_kind:kind,total_rows:page?.total_rows||0,columns:source.columns||[],rows:page?.rows||[]};
  }

  if(state.section==='nps-analysis'){state.scoreChannel='Web';state.npsGroup='Detractores';state.gapDimension='Palanca';}
  const monthLabels = {'01':'Enero','02':'Febrero','03':'Marzo','04':'Abril','05':'Mayo','06':'Junio','07':'Julio','08':'Agosto','09':'Septiembre','10':'Octubre','11':'Noviembre','12':'Diciembre'};
  function updatePublicationChrome(){const filters=publication.filters||{};$('edition-date').textContent=publication.generated_at?new Date(publication.generated_at).toLocaleString('es-ES'):'Pendiente de publicación';$('edition-context').innerHTML=[filters.service_origin,filters.service_origin_n1,filters.service_origin_n2,filters.year,monthLabels[filters.month]||filters.month].filter(Boolean).map(value=>`<span>${esc(value)}</span>`).join('');}
  if(viewer.reportUrl){$('report-link').href=viewer.reportUrl;$('report-link').hidden=false;}
  window.addEventListener('error',() => queueActivity('client_error','client_error','error'));
  window.addEventListener('pagehide',flushActivity);
  async function start(){
    if(viewer.shellDeferred){
      const shellStarted=performance.now();
      $('content').innerHTML='<section class="surface-card loading-state"><div class="loading-bar"></div><h3>Abriendo la edición publicada</h3><p>Preparando el snapshot sin recalcular información.</p></section>';
      try{
        const compressed=typeof DecompressionStream==='function';
        const response=await rpc('getPublishedShell',[viewer.scopeKey,compressed]);
        applyPublication(compressed?await decodePublication(response.payload):response.payload);
      }catch(error){telemetryReady=true;queueActivity('snapshot_load','getPublishedShell','error',performance.now()-shellStarted);$('content').innerHTML=`<section class="surface-card"><p class="error">${esc(error.message||error)}</p></section>`;return;}
      telemetryReady=true;queueActivity('snapshot_load','getPublishedShell','ok',performance.now()-shellStarted);
    }
    if(!viewer.shellDeferred)applyPublication(publication);
    updatePublicationChrome();
    queueActivity('app_enter','', 'ok', Math.max(0,Math.round(performance.now())));
    render();
  }
  start();
})();
</script>
