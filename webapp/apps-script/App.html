<script>
(() => {
  'use strict';
  const publication = JSON.parse(document.getElementById('publication-data').textContent || '{}');
  const viewer = JSON.parse(document.getElementById('viewer-data').textContent || '{}');
  const dashboard = publication.screens?.dashboard || {};
  const linking = publication.screens?.linking || {};
  const datasets = publication.screens?.data || {};
  const state = {area:'summary', view:'period-aggregates', started:performance.now()};
  const areas = [
    {id:'summary',label:'Sumario del periodo',views:[['period-aggregates','Agregados por periodo'],['daily','NPS clásico vs detractores'],['volume-mix','Cómo y cuándo lo dicen'],['gaps','Dónde se separa el NPS'],['opportunities','Oportunidades priorizadas'],['cohorts','Comparativas cruzadas']]},
    {id:'thermal',label:'Analítica NPS Térmico',views:[['topics','Qué dicen los clientes'],['comparison','Cambios respecto al histórico']]},
    {id:'linking',label:'Incidencias ↔ NPS',views:(linking.navigation||[['situation','Situación'],['entity-summary','Resumen causal'],['scenarios','Escenarios'],['nps-deep-dive','Detalle NPS']]).map(item=>[item.id||item[0],item.label||item[1]])},
    {id:'data',label:'Datos de soporte',views:[['nps','NPS'],['helix','Helix']]},
    {id:'presentation',label:'Presentación',views:[]}
  ];
  if(viewer.isAdmin) areas.push({id:'administration',label:'Administración',views:[['publication','Publicación'],['newsletter','Newsletter'],['telemetry','Telemetría']]});
  const $=id=>document.getElementById(id);
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const label=value=>String(value??'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  const format=value=>typeof value==='number'?new Intl.NumberFormat('es-ES',{maximumFractionDigits:1}).format(value):String(value??'—');
  function rows(value){return Array.isArray(value)?value:[]}
  function table(items,limit=250){const data=rows(items).slice(0,limit);if(!data.length)return '<div class="empty">No hay información suficiente en esta edición.</div>';const columns=[...new Set(data.flatMap(row=>Object.keys(row||{})))].slice(0,14);return `<div class="table-wrap"><table><thead><tr>${columns.map(key=>`<th>${esc(label(key))}</th>`).join('')}</tr></thead><tbody>${data.map(row=>`<tr>${columns.map(key=>{const raw=row?.[key];const text=typeof raw==='object'?JSON.stringify(raw):format(raw);const href=String(row?.url||row?.incident_id__href||'');return `<td>${href&&/incident|record id/i.test(key)?`<a href="${esc(href)}" target="_blank" rel="noreferrer">${esc(text)}</a>`:esc(text)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
  function metric(name,value){return `<article class="card"><div class="metric-label">${esc(name)}</div><div class="metric-value">${esc(format(value))}</div></article>`}
  function figure(spec,id){if(!spec?.data?.length)return '<div class="empty">No hay señal suficiente para construir esta visualización.</div>';setTimeout(()=>{const target=$(id);if(target&&window.Plotly)Plotly.newPlot(target,spec.data,spec.layout||{}, {displayModeBar:false,responsive:true})},0);return `<div id="${id}" class="chart"></div>`}
  function hero(title,copy){return `<div class="hero"><h3>${esc(title)}</h3><p>${esc(copy||'Información consolidada con las mismas reglas de negocio de NPS Lens local.')}</p><div class="pills">${rows(dashboard.context_pills).map(value=>`<span class="pill">${esc(value)}</span>`).join('')}</div></div>`}
  function summary(view){const k=dashboard.kpis||{},overview=dashboard.overview||{};if(view==='period-aggregates')return hero(dashboard.scope?.cumulative?.label||'Visión ejecutiva',dashboard.scope?.cumulative?.note)+`<div class="grid">${metric('Muestras',k.samples)}${metric('Score medio',k.nps_average)}${metric('NPS clásico',k.classic_nps)}${metric('Detractores',k.detractor_rate)}${metric('Promotores',k.promoter_rate)}${metric('Comentarios',k.comments)}<article class="card wide"><h3>Evolución por periodo</h3>${figure(overview.period_aggregates_figure,'period-chart')}</article></div>`;if(view==='daily')return hero('NPS clásico y detractores','La lectura diaria separa nivel, tendencia y composición.')+`<div class="grid"><article class="card wide">${figure(overview.daily_nps_figure||overview.daily_figure,'daily-chart')}</article><article class="card wide">${table(overview.daily_table)}</article></div>`;if(view==='volume-mix')return hero('Cómo y cuándo lo dicen','Volumen, canal y mezcla de respuesta a lo largo del periodo.')+`<div class="grid"><article class="card wide">${figure(overview.daily_volume_mix_figure,'volume-chart')}</article></div>`;if(view==='gaps')return hero('Dónde se separa el NPS','Brechas con base suficiente y distancia frente al conjunto.')+`<div class="grid"><article class="card wide">${figure(dashboard.gaps?.figure,'gaps-chart')}</article><article class="card wide">${table(dashboard.gaps?.table)}</article></div>`;if(view==='opportunities')return hero('Oportunidades priorizadas','Conceptos equivalentes se muestran con una única denominación de negocio.')+`<div class="grid"><article class="card wide">${table(dashboard.opportunities?.table||dashboard.opportunities?.rows)}</article></div>`;return hero('Comparativas cruzadas','Lecturas por cohortes protegidas por el tamaño mínimo de muestra.')+`<div class="grid"><article class="card wide">${table(dashboard.cohorts?.table||dashboard.cohorts?.rows)}</article></div>`}
  function thermal(view){if(view==='topics')return hero('Qué dicen los clientes','Temas, evidencias y lenguaje real de cliente.')+`<div class="grid"><article class="card half"><h3>Temas principales</h3>${table(dashboard.topics?.table||dashboard.topics?.rows)}</article><article class="card half"><h3>Evidencias</h3>${table(dashboard.topics?.evidence||dashboard.evidence?.rows)}</article></div>`;return hero('Cambios respecto al histórico','Diferencias comparables con su base y dirección.')+`<div class="grid"><article class="card wide">${figure(dashboard.comparison?.figure,'comparison-chart')}</article><article class="card wide">${table(dashboard.comparison?.table)}</article></div>`}
  function scenarioCards(cards){return rows(cards).map((card,index)=>`<article class="card wide scenario"><h4>${esc(card.title||card.anchor_topic||`Escenario ${index+1}`)}</h4><p>${esc(card.statement||card.chain_story||card.rationale||card.summary||'')}</p><div class="scenario-grid">${rows(card.spotlight_metrics).map(item=>`<div class="fact"><span>${esc(item.label||'Indicador')}</span><strong>${esc(format(item.value))}</strong></div>`).join('')||Object.entries(card).filter(([key,value])=>!['title','statement','chain_story'].includes(key)&&['string','number'].includes(typeof value)).slice(0,12).map(([key,value])=>`<div class="fact"><span>${esc(label(key))}</span><strong>${esc(format(value))}</strong></div>`).join('')}</div><details open><summary>Evidencia Helix</summary>${table(card.incident_records||[],20)}</details><details><summary>Voz del cliente</summary>${table(card.comment_records||[],20)}</details><details><summary>Matriz visual</summary>${figure(card.matrix_figure,`matrix-${index}`)}</details><details><summary>Ficha cuantitativa</summary>${table(card.detail_table||[],30)}</details><details><summary>Heat map</summary>${figure(card.heatmap_figure,`heat-${index}`)}</details><details><summary>Changepoints + lag</summary>${figure(card.changepoints_figure,`cp-${index}`)}</details><details><summary>Lag en días</summary>${figure(card.lag_figure,`lag-${index}`)}</details></article>`).join('')||'<div class="empty">No hay escenarios defendibles en esta edición.</div>'}
  function linkingView(view){if(!linking.available)return hero('Cruce todavía no disponible',linking.empty_state||'Se necesita una base Helix y NPS suficiente.');if(view==='situation')return hero(linking.situation?.narrative?.title||'Situación causal',linking.situation?.narrative?.summary)+`<div class="grid">${Object.entries(linking.kpis||{}).slice(0,9).map(([key,value])=>metric(label(key),value)).join('')}<article class="card wide">${figure(linking.situation?.figure,'situation-chart')}</article></div>`;if(view==='entity-summary')return hero(linking.entity_summary?.title||'Resumen causal',linking.entity_summary?.subtitle)+`<div class="grid"><article class="card wide">${figure(linking.entity_summary?.figure,'entity-chart')}</article><article class="card wide">${table(linking.entity_summary?.table)}</article></div>`;if(view==='scenarios')return hero(linking.scenarios?.title||'Escenarios causales',linking.scenarios?.subtitle)+`<div class="grid">${scenarioCards(linking.scenarios?.cards)}</div>`;return hero(linking.deep_dive?.title||'Análisis de tópicos NPS',linking.deep_dive?.subtitle)+`<div class="grid"><article class="card wide"><h3>Tópicos en tendencia</h3>${figure(linking.deep_dive?.trending?.figure,'trending-chart')}</article><article class="card wide"><h3>Ranking de hipótesis</h3>${table(linking.deep_dive?.ranking?.rows)}</article><article class="card wide"><h3>Muro de evidencias</h3>${table(linking.deep_dive?.evidence?.rows)}</article></div>`}
  function data(view){const source=datasets[view]||{};return hero(view==='nps'?'Base NPS':'Base Helix','Muestra estática de soporte incluida en la edición publicada.')+`<div class="grid"><article class="card wide"><div class="pills"><span class="pill">${esc(format(source.total_rows||rows(source.rows).length))} filas</span><span class="pill">${esc(rows(source.columns).length)} columnas</span></div>${table(source.rows,500)}</article></div>`}
  function rpc(name,args=[]){return new Promise((resolve,reject)=>{if(viewer.local){if(name==='getReportUrl')return resolve('');if(name==='getAdministration')return resolve({version:'local',generatedAt:publication.generated_at,telemetry:{events:0,errors:0,p95Ms:0,screens:[]}});if(name==='recordTelemetry')return resolve({accepted:args[0]?.length||0});return resolve({})}google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args)})}
  function administration(view){if(view==='telemetry'){setTimeout(async()=>{try{const value=(await rpc('getAdministration')).telemetry||{};$('telemetry-body').innerHTML=`<div class="grid">${metric('Eventos',value.events)}${metric('Errores',value.errors)}${metric('P95 de respuesta',`${format(value.p95Ms)} ms`)}<article class="card wide"><h3>Pantallas más consultadas</h3>${table(value.screens)}</article></div>`}catch(error){$('telemetry-body').innerHTML=`<p class="error">${esc(error.message)}</p>`}},0);return hero('Telemetría de experiencia','Uso, errores y tiempos de respuesta para orientar optimizaciones.')+'<div id="telemetry-body" class="status">Preparando diagnóstico…</div>'}if(view==='newsletter'){setTimeout(async()=>{try{const value=await rpc('getNewsletterSettings');$('newsletter-recipients').value=value.recipients||'';$('newsletter-subject').value=value.subject||''}catch(error){$('newsletter-status').textContent=error.message}},0);return hero('Newsletter ejecutiva','Configura una comunicación exclusiva, vinculada a esta edición y su presentación.')+`<article class="card wide"><div class="admin-form"><input id="newsletter-recipients" placeholder="Destinatarios @bbva.com separados por coma"><input id="newsletter-subject" placeholder="Asunto"><button id="newsletter-save" class="button">Guardar</button></div><p id="newsletter-status" class="status">Solo el administrador puede guardar o enviar.</p><button id="newsletter-send" class="button secondary">Enviar newsletter</button></article>`}setTimeout(async()=>{try{const value=await rpc('getAdministration');$('admin-status').textContent=`Versión ${value.version} · Información generada ${value.generatedAt||'sin fecha'}`}catch(error){$('admin-status').textContent=error.message}},0);return hero('Administración de la publicación','La configuración y la newsletter permanecen reservadas al administrador.')+`<article class="card wide"><h3>Edición disponible</h3><p id="admin-status" class="status">Validando…</p><p>Publica los ficheros validados en Drive. El público navega contenido estático y no puede alterar filtros ni reglas.</p><div class="admin-form"><input id="edition-file" placeholder="ID de publication.json en Drive"><input id="report-file" placeholder="ID de la presentación en Drive"><button id="publication-save" class="button">Publicar edición</button></div></article>`}
  function render(){const area=areas.find(item=>item.id===state.area)||areas[0];$('screen-title').textContent=area.label;document.querySelectorAll('.nav-button').forEach(button=>button.classList.toggle('active',button.dataset.area===area.id));$('secondary-nav').innerHTML=area.views.map(([id,name])=>`<button class="tab ${id===state.view?'active':''}" data-view="${esc(id)}">${esc(name)}</button>`).join('');document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{state.view=button.dataset.view;render()});let html='';if(area.id==='summary')html=summary(state.view);else if(area.id==='thermal')html=thermal(state.view);else if(area.id==='linking')html=linkingView(state.view);else if(area.id==='data')html=data(state.view);else if(area.id==='presentation')html=hero('Presentación exclusiva','Accede al informe diseñado para la newsletter y al racional extendido en estas pantallas.')+'<article class="card wide"><h3>Informe ejecutivo</h3><p>La presentación corresponde exactamente a la información publicada.</p></article>';else html=administration(state.view);$('content').innerHTML=html;if($('publication-save'))$('publication-save').onclick=async()=>{try{await rpc('setPublishedEditionFiles',[{editionFileId:$('edition-file').value,reportFileId:$('report-file').value}]);$('admin-status').textContent='Edición publicada correctamente.'}catch(error){$('admin-status').textContent=error.message}};if($('newsletter-save'))$('newsletter-save').onclick=async()=>{try{await rpc('saveNewsletterSettings',[{recipients:$('newsletter-recipients').value,subject:$('newsletter-subject').value}]);$('newsletter-status').textContent='Configuración guardada.'}catch(error){$('newsletter-status').textContent=error.message}};if($('newsletter-send'))$('newsletter-send').onclick=async()=>{try{const value=await rpc('sendNewsletter');$('newsletter-status').textContent=`Newsletter enviada a ${value.sent} destinatarios.`}catch(error){$('newsletter-status').textContent=error.message}};history.replaceState(null,'',`#${area.id}/${state.view}`);rpc('recordTelemetry',[[{type:'view',screen:`${area.id}/${state.view}`,durationMs:Math.round(performance.now()-state.started)}]]).catch(()=>{});state.started=performance.now()}
  $('primary-nav').className='primary-nav';$('primary-nav').innerHTML=areas.map(area=>`<button class="nav-button" data-area="${area.id}">${esc(area.label)}</button>`).join('');document.querySelectorAll('.nav-button').forEach(button=>button.onclick=()=>{const area=areas.find(item=>item.id===button.dataset.area);state.area=area.id;state.view=area.views[0]?.[0]||'';render()});const hash=location.hash.slice(1).split('/');if(areas.some(area=>area.id===hash[0])){state.area=hash[0];state.view=hash[1]||areas.find(area=>area.id===hash[0]).views[0]?.[0]||''}$('edition-date').textContent=publication.generated_at?new Date(publication.generated_at).toLocaleString('es-ES'):'Pendiente de publicación';rpc('getReportUrl').then(url=>{if(url){$('report-link').href=url;$('report-link').hidden=false}}).catch(()=>{});window.addEventListener('error',event=>rpc('recordTelemetry',[[{type:'error',screen:`${state.area}/${state.view}`,detail:event.message}]]).catch(()=>{}));render();
})();
</script>
